[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sharenet-gateway"
version = "1.0.0"
description = "Share a local SOCKS5 tunnel with LAN devices on Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "keyring==25.7.0",
  "playwright==1.63.0",
  "customtkinter==5.2.2",
  "Pillow==11.3.0"
]

[project.scripts]
sharenet = "sharenet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
